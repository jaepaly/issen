<!doctype html>
<!--
  촬영용 하네스(초안). 게임 파일(main.js, game.js)은 고치지 않고, 불러오기 전에 Arena.createGame 을 감싸
  게임 상태를 window.__s 로 꺼낸 뒤 장면을 강제로 만든다. tools/capture.py 가 headless Chrome 으로 연다.
  직접 볼 때: 저장소 최상위에서 python -m http.server 8000 → http://localhost:8000/tools/capture.html?scene=line
  장면: title, aim(빨간 유닛 옆으로 무리를 꿰는 조준), cut(그 일섬 직후), wide(줌아웃), end(20초 끝 일제 베기)
  게임 상태 필드 이름이 바뀌면 여기 장면 코드만 고친다. 연출 작업이 끝난 뒤 최종 촬영에 쓴다.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../arena/">
<title>ISSEN capture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1916; }
  canvas { display: block; width: 960px; height: 540px; background: #f6ebd6; cursor: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script src="img/meta.js"></script>
<script src="game.js"></script>
<script>
(() => {
  const A = window.Arena, orig = A.createGame;
  A.createGame = function (seed) { const s = orig.call(this, 20261107); window.__s = s; return s; }; // 촬영은 시드 고정
  const q = new URLSearchParams(location.search), scene = q.get("scene") || "title";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const cv = () => document.getElementById("c");
  function pointer(type, x, y) { // 논리 좌표(960x540) → 화면 좌표
    const r = cv().getBoundingClientRect();
    const e = new PointerEvent(type, { clientX: r.left + x * r.width / 960, clientY: r.top + y * r.height / 540, bubbles: true, pointerId: 1, isPrimary: true, button: 0, buttons: type === "pointerup" ? 0 : 1 });
    (type === "pointerdown" ? cv() : window).dispatchEvent(e);
  }
  const click = (x, y) => { pointer("pointermove", x, y); pointer("pointerdown", x, y); pointer("pointerup", x, y); };
  // 무리 한 줄과 그 줄을 스치는 빨간 유닛. 플레이어는 가운데, 오른쪽 위로 긋는다
  function lineup(s, n = 7) {
    s.enemies.length = 0; s.reds.length = 0;
    const p = s.p, ang = -0.32, ux = Math.cos(ang), uy = Math.sin(ang);
    for (let i = 0; i < n; i++) A.add(s, "soldier", p.x + ux * (80 + i * 46) + (i % 2 ? 6 : -6), p.y + uy * (80 + i * 46));
    A.add(s, "runner", p.x - 160, p.y + 90); A.add(s, "soldier", p.x - 220, p.y - 120); A.add(s, "dodger", p.x + 40, p.y + 170);
    const rx = p.x + ux * 260 - uy * 42, ry = p.y + uy * 260 + ux * 42; // 줄에서 42px 떨어져 스치는 자리
    s.reds.push({ x: rx, y: ry, vx: 0, vy: 0, r: A.CFG.red.r, life: 99, first: false });
    s.firstRedPending = false; s.redT = 99;
    return { x: p.x + ux * 420, y: p.y + uy * 420 };
  }
  async function run() {
    await wait(600); // 그림 로딩
    const s = window.__s; if (!s) return;
    if (scene === "title") return;
    click(480, 270); await wait(100); // 시작 화면 닫기
    const s2 = window.__s;
    if (scene === "aim" || scene === "cut") {
      const tgt = lineup(s2); pointer("pointermove", tgt.x, tgt.y);
      if (scene === "cut") { await wait(120); click(tgt.x, tgt.y); await wait(+(q.get("after") || 140)); }
      document.title = "ready"; return;
    }
    if (scene === "wide" || scene === "end") { click(900, 60); await wait(400); } // 첫 일섬을 해야 시간이 흐른다
    if (scene === "wide") {
      const L = A.CFG.zoomByLv.length; s2.lv = s2.maxLv = L; s2.zoom = s2.zoomTarget = A.CFG.zoomByLv[L - 1];
      for (let i = 0; i < 6; i++) A.spawnWave(s2);
      await wait(2500); pointer("pointermove", 760, 140); document.title = "ready"; return;
    }
    if (scene === "end") {
      for (let i = 0; i < 4; i++) A.spawnWave(s2);
      s2.t = A.CFG.limit - 0.6; await wait(+(q.get("after") || 1200)); document.title = "ready"; return;
    }
  }
  addEventListener("load", run);
})();
</script>
<script src="main.js"></script>
</body>
</html>
